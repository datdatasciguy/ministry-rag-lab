name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build native app and disk image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python build_installer.py --version "$RELEASE_VERSION"
      - name: Check packaged startup
        run: |
          APP="outputs/installer-build/dist/Ministry Search RAG.app/Contents/MacOS/Ministry Search RAG"
          "$APP" --no-browser --port 8876 --data-dir "$RUNNER_TEMP/ministry-check" &
          APP_PID=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8876/setup/status > "$RUNNER_TEMP/setup-status.json"; then break; fi
            sleep 1
          done
          python -c 'import json,os; s=json.load(open(os.environ["RUNNER_TEMP"]+"/setup-status.json")); assert len(s["models"])==8 and not s["ready"]'
          kill "$APP_PID"
          codesign --verify --deep --strict "outputs/installer-build/dist/Ministry Search RAG.app"
          hdiutil verify outputs/installer-build/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ministry-search-${{ matrix.runner }}
          path: |
            outputs/installer-build/*.dmg
            outputs/installer-build/*.sha256
